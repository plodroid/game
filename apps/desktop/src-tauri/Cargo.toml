[package]
name = "chromashift"
version = "1.1.0"
description = "CHROMASHIFT desktop app"
authors = ["CHROMASHIFT"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"

[profile.release]
# A small, quick-to-start launcher: all the work happens in the web view.
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

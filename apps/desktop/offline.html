<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>CHROMASHIFT</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body { display: grid; place-items: center; background: #120f17; color: #f3eef7; font: 16px/1.5 system-ui, sans-serif; text-align: center; }
      h1 { font-size: 28px; letter-spacing: 0.04em; margin: 0 0 8px; }
      p { margin: 0; color: #b8adc4; }
      .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #ff4f9a; margin-right: 8px; animation: pulse 1.2s ease-in-out infinite; }
      @keyframes pulse { 50% { opacity: 0.3; } }
    </style>
  </head>
  <body>
    <main>
      <h1>CHROMASHIFT</h1>
      <p><span class="dot"></span>Can't reach the game. Connecting again…</p>
      <p>The first launch needs the internet; after that it also starts offline.</p>
    </main>
    <script>
      const to = new URLSearchParams(location.search).get('to');
      if (to && /^https?:\/\//.test(to)) setTimeout(() => (location.href = to), 5000);
    </script>
  </body>
</html>

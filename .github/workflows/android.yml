# Builds the Android apps (Capacitor shells around the live site) and attaches the APKs to a release:
# CHROMASHIFT.apk (phones and tablets, both games) and VELOCITY-TV.apk (Android TV, VELOCITY only).
# The app loads https://plodroid.github.io/game/, so site updates reach it without a new APK.
name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths: ['apps/mobile/**']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Sync Capacitor and build
        working-directory: apps/mobile
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assemblePhoneDebug assembleTvDebug
      - name: Publish the APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp apps/mobile/android/app/build/outputs/apk/phone/debug/app-phone-debug.apk CHROMASHIFT.apk
          cp apps/mobile/android/app/build/outputs/apk/tv/debug/app-tv-debug.apk VELOCITY-TV.apk
          gh release view android >/dev/null 2>&1 || gh release create android --title "Android app" --notes "CHROMASHIFT.apk: Android phones and tablets. VELOCITY-TV.apk: Android TV (VELOCITY only)."
          gh release upload android CHROMASHIFT.apk VELOCITY-TV.apk --clobber
